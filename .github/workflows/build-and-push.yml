name: Build and Push Tagged Docker Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: thwar
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            thwar/fortyfives.net:${{ github.ref_name }}
            thwar/fortyfives.net:latest

      # The compose stacks pin APP_IMAGE to an immutable digest; surface it so
      # the deploy step in docs/deploy.md can be followed verbatim.
      - name: Print image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          {
            echo "## Release image"
            echo
            echo "Tag: \`thwar/fortyfives.net:${{ github.ref_name }}\`"
            echo
            echo "Set in \`.env\`:"
            echo
            echo '```'
            echo "APP_IMAGE=docker.io/thwar/fortyfives.net@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
