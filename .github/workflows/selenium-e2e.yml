name: Run tbot e2e

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same PR makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-test:
    runs-on: ubuntu-24.04
    # tbot's TOTAL_RUNTIME_TIMEOUT is 900s on its own, plus wait_play and the
    # image build; leave headroom so failures upload artifacts instead of
    # being cancelled.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: my-elixir-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ubuntu-24.04 ships matching Chrome and chromedriver builds; Selenium
      # Manager picks them up, so nothing is downloaded here.
      - name: Show browser versions
        run: |
          google-chrome --version
          chromedriver --version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Create virtual environment
        run: python -m venv venv

      - name: Cache Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          source venv/bin/activate
          cd python
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ephemeral database credentials
        run: echo "E2E_DATABASE_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run tbot scenarios
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker rm -f postgres-db my-elixir-app-container 2>/dev/null || true

          docker run -d --name postgres-db --network host \
            -e POSTGRES_PASSWORD="$E2E_DATABASE_PASSWORD" \
            -e POSTGRES_DB=website_45s_v3_dev \
            docker.io/library/postgres:15.19-alpine3.24@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b

          docker run -d --name my-elixir-app-container --network host \
            -e DATABASE_HOST=localhost \
            -e DATABASE_PORT=5432 \
            -e DATABASE_USER=postgres \
            -e DATABASE_PASSWORD="$E2E_DATABASE_PASSWORD" \
            -e DATABASE_NAME=website_45s_v3_dev \
            my-elixir-app:latest

          timeout=300
          start_time=$(date +%s)
          until curl -sf -o /dev/null http://localhost:4000; do
            if (( $(date +%s) - start_time >= timeout )); then
              echo "Timeout waiting for the elixir app"
              docker logs my-elixir-app-container
              exit 1
            fi
            echo "Waiting..."
            sleep 5
          done

          source venv/bin/activate
          echo 'Running wait_play'
          TBOT_ARTIFACT_DIR=artifacts python -u python/wait_play.py

          python/run_e2e.sh

      - name: Dump app logs on failure
        if: failure()
        run: docker logs my-elixir-app-container 2>&1 | tail -n 300

      - name: Upload Selenium artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selenium-e2e-artifacts
          path: |
            tbot_*.log
            artifacts/**
          if-no-files-found: ignore
