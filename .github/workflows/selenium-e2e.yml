name: Run tbot e2e

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  e2e-test:
    runs-on: ubuntu-24.04
    # tbot's TOTAL_RUNTIME_TIMEOUT is 900s on its own, plus wait_play and the
    # image build; leave headroom so failures upload artifacts instead of
    # being cancelled.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: my-elixir-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Chrome and ChromeDriver
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable unzip
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          DRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
          wget $DRIVER_URL -O chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          sudo mv -f chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          google-chrome --version
          chromedriver --version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Create virtual environment
        run: python -m venv venv

      - name: Cache Python dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          source venv/bin/activate
          cd python
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ephemeral database credentials
        run: echo "E2E_DATABASE_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run tbot instances
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker rm -f postgres-db my-elixir-app-container 2>/dev/null || true

          docker run -d --name postgres-db --network host \
            -e POSTGRES_PASSWORD="$E2E_DATABASE_PASSWORD" \
            -e POSTGRES_DB=website_45s_v3_dev \
            docker.io/library/postgres:15.19-alpine3.24@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b

          docker run -d --name my-elixir-app-container --network host \
            -e DATABASE_HOST=localhost \
            -e DATABASE_PORT=5432 \
            -e DATABASE_USER=postgres \
            -e DATABASE_PASSWORD="$E2E_DATABASE_PASSWORD" \
            -e DATABASE_NAME=website_45s_v3_dev \
            my-elixir-app:latest

          timeout=300
          start_time=$(date +%s)
          until curl -s http://localhost:4000; do
            if (( $(date +%s) - start_time >= timeout )); then
              echo "Timeout waiting for the elixir app"
              docker logs my-elixir-app-container
              exit 1
            fi
            echo "Waiting..."
            sleep 5
          done

          source venv/bin/activate
          echo 'Running wait_play'
          python -u python/wait_play.py

          echo 'Running 4 tbot instances...'
          pids=()
          for i in {1..4}; do
            TBOT_INSTANCE="$i" TBOT_ARTIFACT_DIR=artifacts python -u python/tbot.py > "tbot_$i.log" 2>&1 &
            pids+=("$!")
          done

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "At least one tbot instance failed"
            exit 1
          fi

      - name: Upload tbot logs to Actions
        if: always()
        run: |
          for i in {1..4}; do
            echo "::group::tbot instance $i log"
            cat tbot_$i.log
            echo "::endgroup::"
          done

      - name: Upload Selenium artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selenium-e2e-artifacts
          path: |
            tbot_*.log
            artifacts/**
          if-no-files-found: ignore

      - name: Check tbot logs for success
        run: |
          for i in {1..4}; do
            grep -q "Final Scoring detected" "tbot_$i.log" \
              || { echo "Missing scoring in tbot_$i.log"; exit 1; }
            grep -q "WebDriver closed" "tbot_$i.log" \
              || { echo "Missing WebDriver closed in tbot_$i.log"; exit 1; }
          done
