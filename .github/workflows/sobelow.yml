name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sobelow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.5'
          otp-version: '27.3'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: mix deps.get

      - name: Audit Hex dependencies (retired packages)
        run: mix hex.audit

      - name: Audit Hex dependencies (known vulnerabilities)
        run: mix deps.audit

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r python/requirements.txt

      - name: Run Sobelow
        run: mix sobelow --exit --threshold medium --strict
