name: UI check

# Screenshots key pages of this commit and of the commit it builds on, then
#   - fails on broken layout invariants (python/ui_check.py --check), and
#   - reports, without failing, which pages look different (python/ui_diff.py),
#     with before/after images in the ui-screenshots artifact.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pick the commit to compare against
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing against ${base:-nothing}"
          if [ -n "$base" ]; then git worktree add --detach ../ui-base "$base"; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build this commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ui-new:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the base commit
        if: steps.base.outputs.sha != ''
        continue-on-error: true
        id: build_base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ../ui-base
          file: ../ui-base/Dockerfile
          push: false
          load: true
          tags: ui-base:latest
          cache-from: type=gha

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r python/requirements.txt

      - name: Start both builds
        env:
          BASE_BUILT: ${{ steps.build_base.outcome == 'success' }}
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          start() { # name image host-port
            docker run -d --name "$1-db" -p "$3:4000" \
              -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=website_45s_v3_dev \
              docker.io/library/postgres:15.19-alpine3.24@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
            # Share the database container's network so the app reaches
            # Postgres on localhost, whatever its entrypoint assumes.
            docker run -d --name "$1-app" --network "container:$1-db" \
              -e DATABASE_HOST=localhost -e DATABASE_PORT=5432 \
              -e DATABASE_USER=postgres -e DATABASE_PASSWORD="$password" \
              -e DATABASE_NAME=website_45s_v3_dev "$2"
          }
          wait_for() { # name host-port
            for _ in $(seq 1 60); do
              curl -sf -o /dev/null "http://127.0.0.1:$2/" && return 0
              sleep 5
            done
            docker logs "$1-app" | tail -n 100
            return 1
          }
          start ui-new ui-new:latest 4000
          if [ "$BASE_BUILT" = "true" ]; then start ui-base ui-base:latest 4001; fi
          wait_for ui-new 4000
          if [ "$BASE_BUILT" = "true" ]; then
            wait_for ui-base 4001 || echo "::warning::Base commit did not start; skipping the visual diff"
          fi

      - name: Check layout invariants
        id: check
        run: venv/bin/python -u python/ui_check.py --url http://127.0.0.1:4000 --out artifacts/ui/new --check

      - name: Screenshot the base commit
        if: always() && steps.build_base.outcome == 'success'
        continue-on-error: true
        id: base_shots
        run: venv/bin/python -u python/ui_check.py --url http://127.0.0.1:4001 --out artifacts/ui/base

      - name: Compare screenshots
        if: always() && steps.base_shots.outcome == 'success'
        run: venv/bin/python -u python/ui_diff.py artifacts/ui/base artifacts/ui/new artifacts/ui/diff

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: artifacts/ui/**
          if-no-files-found: ignore
