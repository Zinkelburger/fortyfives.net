name: Uptime check

# Asks the production server every 30 minutes whether the site is up, whether
# sign-in is configured and whether the TLS certificate has two weeks left.
# A failed run emails whoever last edited this schedule. GitHub pauses
# scheduled workflows after 60 days without repository activity.
#
# The requests go straight to the server, not through Cloudflare, which
# challenges GitHub's runners (see live-check.yml). That still covers the
# host, nginx, the app, the database and the certificate nginx serves.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SITE: fortyfives.net
  ORIGIN: 89.117.75.142

jobs:
  uptime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Site answers and the database responds
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 20 --retry-all-errors -m 20 \
            --resolve "$SITE:443:$ORIGIN" "https://$SITE/healthz")
          echo "/healthz: $body"
          [ "$body" = ok ]

      - name: Sign-in is configured
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors -m 20 \
            --resolve "$SITE:443:$ORIGIN" "https://$SITE/healthz/auth"

      - name: Certificate has at least 14 days left
        run: |
          cert=$(echo | openssl s_client -connect "$ORIGIN:443" -servername "$SITE" 2>/dev/null)
          echo "$cert" | openssl x509 -noout -enddate
          echo "$cert" | openssl x509 -noout -checkend $((14 * 86400))
