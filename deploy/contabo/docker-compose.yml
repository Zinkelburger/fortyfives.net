# Blue/green: web-blue and web-green run the app; the one with scale 1 that
# nginx/slot/live.conf names as default is live. deploy/contabo/slots.sh
# edits the image and scale lines of those two services and of db_backup.
x-logging: &logging
  driver: journald
  options:
    tag: '{{.Name}}'
x-web: &web
  restart: unless-stopped
  env_file:
  - .env
  volumes:
  - app_data:/data
  healthcheck:
    test:
    - CMD
    - wget
    - -qO-
    - http://127.0.0.1:4000/healthz
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
  logging: *logging
services:
  web-blue:
    <<: *web
    image: docker.io/thwar/fortyfives.net@sha256:ca31f2ac6e1197adba320fe5cc4967929bc6ff9fbed48fa65473ac91437ce53d
    scale: 1
    environment:
      DATABASE_PATH: /data/fortyfives.db
      ANALYSIS_WEIGHTS_DIR: /data/analysis
      FF_SLOT: blue
  web-green:
    <<: *web
    image: docker.io/thwar/fortyfives.net@sha256:8b75d18a6bdf17ffaf93cb12ce61505168292f07b6e689fc2272456f9a417089
    scale: 0
    environment:
      DATABASE_PATH: /data/fortyfives.db
      ANALYSIS_WEIGHTS_DIR: /data/analysis
      FF_SLOT: green
  db:
    image: docker.io/library/postgres:15.19-trixie@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48
    restart: unless-stopped
    env_file:
    - .env
    volumes:
    - db_data:/var/lib/postgresql/data
    profiles:
    - postgres-rollback
  nginx:
    image: docker.io/library/nginx:1.30.6-alpine3.24@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/conf.d/site.conf:/etc/nginx/conf.d/site.conf:ro
    - ./nginx/slot:/etc/nginx/slot:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    - ./certbot/www:/var/www/certbot:ro
    command: /bin/sh -c 'while :; do sleep 24h & wait $${!}; nginx -s reload; done
      & nginx -g "daemon off;"'
    logging: *logging
  certbot:
    image: docker.io/certbot/certbot:v5.9.0@sha256:bc93cb710b413e6b456d622f9b0133b3e109c0a78c2ed9976af43d209b0a1805
    restart: unless-stopped
    volumes:
    - /etc/letsencrypt:/etc/letsencrypt
    - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w
      /var/www/certbot; sleep 12h & wait $${!}; done;'
    logging: *logging
  db_backup:
    image: docker.io/thwar/fortyfives.net@sha256:ca31f2ac6e1197adba320fe5cc4967929bc6ff9fbed48fa65473ac91437ce53d
    restart: unless-stopped
    user: root
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
    - app_data:/data
    - sqlite_backups:/backups
    - ./scripts/backup-sqlite.sh:/backup-sqlite.sh:ro
    entrypoint:
    - /bin/sh
    - /backup-sqlite.sh
    healthcheck:
      test:
      - CMD-SHELL
      - find /backups -name 'fortyfives-*.db' -mmin -1500 | grep -q .
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 60s
    logging: *logging
volumes:
  db_data:
    external: true
    name: fortyfives_db_data
  app_data:
    external: true
    name: fortyfives_app_data
  sqlite_backups:
    external: true
    name: fortyfives_sqlite_backups
