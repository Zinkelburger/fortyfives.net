services:
  web:
    image: docker.io/thwar/fortyfives.net@sha256:8cfcb36dc837d154f7829026912b325a9ec508f554bb21ed3e74ff609944cad6
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
    - app_data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:4000/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  db:
    image: docker.io/library/postgres:15.19-trixie@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48
    restart: unless-stopped
    env_file:
    - .env
    volumes:
    - db_data:/var/lib/postgresql/data
    profiles:
    - postgres-rollback
  nginx:
    image: docker.io/library/nginx:1.30.6-alpine3.24@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/conf.d/site.conf:/etc/nginx/conf.d/site.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    - ./certbot/www:/var/www/certbot:ro
    command: /bin/sh -c 'while :; do sleep 24h & wait $${!}; nginx -s reload; done
      & nginx -g "daemon off;"'
    depends_on:
    - web
  certbot:
    image: docker.io/certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    volumes:
    - /etc/letsencrypt:/etc/letsencrypt
    - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w
      /var/www/certbot; sleep 12h & wait $${!}; done;'
  db_backup:
    image: docker.io/thwar/fortyfives.net@sha256:8cfcb36dc837d154f7829026912b325a9ec508f554bb21ed3e74ff609944cad6
    restart: unless-stopped
    user: root
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
    - app_data:/data
    - sqlite_backups:/backups
    - ./scripts/backup-sqlite.sh:/backup-sqlite.sh:ro
    entrypoint:
    - /bin/sh
    - /backup-sqlite.sh
    healthcheck:
      test:
      - CMD-SHELL
      - find /backups -name 'fortyfives-*.db' -mmin -1500 | grep -q .
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 60s
    logging: *id001
volumes:
  db_data:
    external: true
    name: fortyfives_db_data
  app_data:
    external: true
    name: fortyfives_app_data
  sqlite_backups:
    external: true
    name: fortyfives_sqlite_backups
