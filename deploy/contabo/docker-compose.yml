services:
  web:
    image: docker.io/thwar/fortyfives.net@sha256:890114d07472899bd725aa91eac4da1b30893e89eb2138d305cf75fb7bccc97f
    restart: unless-stopped
    env_file:
    - .env
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
    - app_data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:4000/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  db:
    image: docker.io/library/postgres:15.18-trixie@sha256:74e110c41804365e3915fcc09d5e7a1eff50161aaa94d5da0e58e0cd75ae509c
    restart: unless-stopped
    env_file:
    - .env
    volumes:
    - db_data:/var/lib/postgresql/data
    profiles:
    - postgres-rollback
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/conf.d/site.conf:/etc/nginx/conf.d/site.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    - ./certbot/www:/var/www/certbot:ro
    command: /bin/sh -c 'while :; do sleep 24h & wait $${!}; nginx -s reload; done
      & nginx -g "daemon off;"'
    depends_on:
    - web
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
    - /etc/letsencrypt:/etc/letsencrypt
    - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w
      /var/www/certbot; sleep 12h & wait $${!}; done;'
  db_backup:
    image: docker.io/thwar/fortyfives.net@sha256:890114d07472899bd725aa91eac4da1b30893e89eb2138d305cf75fb7bccc97f
    restart: unless-stopped
    user: root
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
    - app_data:/data
    - sqlite_backups:/backups
    - ./scripts/backup-sqlite.sh:/backup-sqlite.sh:ro
    entrypoint:
    - /bin/sh
    - /backup-sqlite.sh
    healthcheck:
      test:
      - CMD-SHELL
      - find /backups -name 'fortyfives-*.db' -mmin -1500 | grep -q .
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 60s
    logging: *id001
volumes:
  db_data:
    external: true
    name: fortyfives_db_data
  app_data:
    external: true
    name: fortyfives_app_data
  sqlite_backups:
    external: true
    name: fortyfives_sqlite_backups
