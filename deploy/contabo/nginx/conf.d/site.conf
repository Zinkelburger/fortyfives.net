# proxy_pass to a plain hostname resolves it once, at load; a recreated
# `web` container gets a new address and nginx answered 502 until reloaded.
# Docker's DNS (127.0.0.11) is asked again every 10s instead.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream phoenix {
    zone phoenix 64k;
    server web:4000 resolve;
}

server {
    listen 80;
    server_name fortyfives.net www.fortyfives.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fortyfives.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.fortyfives.net;

    ssl_certificate /etc/letsencrypt/live/fortyfives.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortyfives.net/privkey.pem;

    return 301 https://fortyfives.net$request_uri;
}

server {
    listen 443 ssl;
    server_name fortyfives.net;

    ssl_certificate /etc/letsencrypt/live/fortyfives.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortyfives.net/privkey.pem;

    # Vulnerability scanners probe for leaked secrets and PHP/WordPress
    # admin pages, none of which exist here. Drop them without a response
    # or a log line instead of handing them to Phoenix as 404s.
    location ~* ^/(\.env|\.git|\.aws|\.svn|\.htaccess|\.ds_store|wp|wordpress|wp-admin|wp-content|wp-includes|blog|userfiles|phpmyadmin|cgi-bin|__vite)|\.php$ {
        access_log off;
        return 444;
    }

    location / {
        proxy_pass http://phoenix;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
