# proxy_pass to a plain hostname resolves it once, at load; a recreated
# `web` container gets a new address and nginx answered 502 until reloaded.
# Docker's DNS (127.0.0.11) is asked again every 10s instead.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream phoenix {
    zone phoenix 64k;
    server web:4000 resolve;
}

server {
    listen 80;
    server_name fortyfives.net www.fortyfives.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fortyfives.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.fortyfives.net;

    ssl_certificate /etc/letsencrypt/live/fortyfives.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortyfives.net/privkey.pem;

    return 301 https://fortyfives.net$request_uri;
}

server {
    listen 443 ssl;
    server_name fortyfives.net;

    ssl_certificate /etc/letsencrypt/live/fortyfives.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortyfives.net/privkey.pem;

    # Vulnerability scanners probe for leaked secrets and PHP/WordPress
    # admin pages, none of which exist here. Drop them without a response
    # or a log line instead of handing them to Phoenix as 404s.
    location ~* ^/(\.env|\.git|\.aws|\.svn|\.htaccess|\.ds_store|wp|wordpress|wp-admin|wp-content|wp-includes|blog|userfiles|phpmyadmin|cgi-bin|__vite)|\.php$ {
        access_log off;
        return 444;
    }

    # Cloudflare is the only client allowed to say who the visitor is. Its
    # edges are trusted for CF-Connecting-IP; anyone reaching this server
    # directly is the address they connect from, and the headers Phoenix
    # reads (Turnstile.client_ip/1) are overwritten with it below, so a
    # forged CF-Connecting-IP cannot dodge the per-IP rate limits. Ranges
    # from https://www.cloudflare.com/ips-v4 and /ips-v6 (2026-10-16).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    location / {
        proxy_pass http://phoenix;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
