services:
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image digest}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: docker.io/library/postgres:15.18-alpine3.22@sha256:b829a702021452451951dbfb2def91e920f9182cf63ba8e74642e388ad35aef2
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  db_data:
