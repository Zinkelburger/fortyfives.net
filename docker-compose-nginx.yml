# Production stack: Phoenix release + SQLite + nginx (TLS termination) +
# certbot (Let's Encrypt via Cloudflare DNS-01) + nightly SQLite backup sidecar.
# One-time bootstrap steps (volume creation, first certificate) are in
# docs/deploy.md. Values such as ${APP_IMAGE} are interpolated from ./.env.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image digest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging

  db_backup:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image digest}
    restart: unless-stopped
    user: root
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
      - app_data:/data
      - db_backups:/backups
      - ./scripts/backup-sqlite.sh:/backup-sqlite.sh:ro
    entrypoint: ["/bin/sh", "/backup-sqlite.sh"]
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'fortyfives-*.db' -mmin -1500 | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 60s
    logging: *default-logging

  nginx:
    image: docker.io/library/nginx:1.31.8-alpine3.24@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    # Reload daily so renewed certificates are picked up.
    command: "/bin/sh -c 'while :; do sleep 24h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # Let's Encrypt via Cloudflare DNS-01, so a fresh host can obtain its first
  # certificate before nginx (which needs the cert to start) is up. The
  # credentials file is (re)written from CF_API_TOKEN on every start; the
  # token needs Zone:DNS:Edit + Zone:Zone:Read on the fortyfives.net zone.
  # First-run `certonly` command: see docs/deploy.md.
  certbot:
    image: docker.io/certbot/dns-cloudflare:v5.9.0@sha256:8216d4732d11772a9cf2fb30d022abf9eec7c83af2e33f002aa9e371c5192b67
    restart: unless-stopped
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:?Set CF_API_TOKEN in .env (Cloudflare DNS:Edit token for certbot)}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf 'dns_cloudflare_api_token = %s\n' "$$CF_API_TOKEN" > /etc/letsencrypt/cloudflare.ini
        exec "$$@"
      - --
    command:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
          sleep 12h & wait $${!}
        done
    logging: *default-logging

volumes:
  app_data:
    external: true
    name: fortyfives_app_data
  db_backups:
    name: fortyfives_sqlite_backups
