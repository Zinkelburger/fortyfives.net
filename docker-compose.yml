# Local / app-only stack: Phoenix bound to loopback plus SQLite. For the
# public deployment (nginx + certbot) use docker-compose-nginx.yml.
# Values such as ${APP_IMAGE} are interpolated from ./.env by compose.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging

  db_backup:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image digest}
    restart: unless-stopped
    user: root
    environment:
      DATABASE_PATH: /data/fortyfives.db
    volumes:
      - app_data:/data
      - db_backups:/backups
      - ./scripts/backup-sqlite.sh:/backup-sqlite.sh:ro
    entrypoint: ["/bin/sh", "/backup-sqlite.sh"]
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'fortyfives-*.db' -mmin -1500 | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 60s
    logging: *default-logging

volumes:
  app_data:
    name: fortyfives_app_data_local
  db_backups:
    name: fortyfives_sqlite_backups_local
