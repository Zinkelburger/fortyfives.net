# Reverse proxy for the Phoenix release (service "web" in
# docker-compose-nginx.yml). TLS terminates here; the app itself owns HTTPS
# redirects and the Strict-Transport-Security header via Plug.SSL
# (config/prod.exs), so no HSTS header is added in this file.
#
# This file is included inside nginx's `http {}` block, so http-level
# directives may be set here.

server_tokens off;

# WebSocket upgrade for LiveView: pass "Connection: upgrade" only when the
# client asked for an upgrade, otherwise "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    listen [::]:80;
    server_name fortyfives.net www.fortyfives.net;

    # Local liveness probe for the compose healthcheck; never proxied.
    location = /nginx-health {
        access_log off;
        return 204;
    }

    location / {
        return 301 https://fortyfives.net$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fortyfives.net;

    ssl_certificate /etc/letsencrypt/live/fortyfives.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortyfives.net/privkey.pem;

    return 301 https://fortyfives.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fortyfives.net;

    ssl_certificate /etc/letsencrypt/live/fortyfives.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortyfives.net/privkey.pem;
    client_max_body_size 1m;

    # Vulnerability scanners probe for leaked secrets and PHP/WordPress
    # admin pages, none of which exist here. Drop them without a response
    # or a log line instead of handing them to Phoenix as 404s.
    location ~* ^/(\.env|\.git|\.aws|\.svn|\.htaccess|\.ds_store|wp|wordpress|wp-admin|wp-content|wp-includes|blog|userfiles|phpmyadmin|cgi-bin|__vite)|\.php$ {
        access_log off;
        return 444;
    }

    # Trust Cloudflare's client-IP header only when the connection itself came
    # from a published Cloudflare network. Keep this list synchronized with
    # https://www.cloudflare.com/ips/. To refresh it:
    #
    #   { curl -fsS https://www.cloudflare.com/ips-v4; echo;
    #     curl -fsS https://www.cloudflare.com/ips-v6; echo; } \
    #     | sed 's/^/    set_real_ip_from /; s/$/;/'
    #
    # then replace the block below and `docker compose exec nginx nginx -s reload`.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    location / {
        proxy_pass http://web:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LiveView websockets are long-lived; do not let idle sockets be
        # cut by the 60s default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
